@if (LOADING()) {
    <div class="cart-loading">Loading...</div>
}

@if (LIST_CONTENT()) {
    <app-product-list
        [CONTENT]="LIST_CONTENT()!"></app-product-list>

    @if(TOTAL()) {
        <div class="cart-checkout">
            <a routerLink="/checkout" class="cart-checkout__btn">
                Proceed to Checkout
            </a>
        </div>
    }
}
